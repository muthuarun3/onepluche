# Fiche relue par Muthu avant publication (dossier de conception, étape 6).
# Texte : « Tenir la promesse de la France », lettre de Bernard Cazeneuve datée du
# 15 juillet 2026 (86 pages), publiée sur la-convention.fr. Les mesures reprennent la partie
# « Les propositions de Bernard Cazeneuve » (pages 77 à 85) ; chaque citation est un extrait
# exact du texte, page indiquée.
#
# Candidature : « volonté pleine et entière » d'être candidat (France Inter, 19 mai 2026),
# puis candidature présentée avec cette lettre et un entretien au Parisien le 16 juillet 2026
# (Public Sénat, 17 juillet 2026). Le texte est daté du 15 juillet : c'est la date retenue.
#
# Propositions de la lettre non rangées faute de sujet dans la grille commune : n° 3 (les
# femmes), n° 7 (l'outre-mer), n° 20 (agriculture), n° 29 (intelligence artificielle).

