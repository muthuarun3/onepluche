# Fiche relue par Muthu avant publication (dossier de conception, étape 6).
# Texte : « Grandes orientations pour un projet patriote + le Frexit en 10 questions », édition
# 2026-2027, livret du mouvement Les Patriotes présidé par Florian Philippot (règle de Muthu du
# 25/11/2026 : le programme publié par le parti d'un candidat déclaré compte). Le livret n'est
# pas daté : date retenue = dernière modification du PDF (24 septembre 2026), mis en ligne en
# septembre 2026 d'après son adresse. Pages = numéros imprimés (le PDF met deux pages par feuille).
#
# Candidature déclarée le 9 mai 2026 (« Je suis candidat à l'élection présidentielle », Sud Radio,
# 9 mai 2026).
#
# Propositions du livret non rangées faute de sujet dans la grille commune : agriculture (p. 5),
# renationalisation des autoroutes et monopoles publics du rail (p. 6), Aide sociale à l'enfance
# (p. 7), handicap (p. 9), protection animale et biodiversité (p. 10), souveraineté numérique et
# intelligence artificielle (p. 11), outre-mer (p. 20), culture et patrimoine (p. 21), argent
# liquide, identité numérique et pass sanitaire (p. 22). Les dix questions sur le Frexit
# (p. 23 à 31) expliquent la sortie de l'UE sans mesure nouvelle.

