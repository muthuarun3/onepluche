titre = "Enquête publique sur les régimes spéciaux de retraite"
citation = "Le président fera réaliser une enquête sur les catégories qui bénéficient de régimes spéciaux de retraite, en particulier les hauts fonctionnaires et les responsables politiques. Cet état des lieux sera rendu public et permettra à chaque citoyen d’engager une réforme si le gouvernement ou le Parlement ne s’emparent pas du sujet d’une manière qui lui convient."
version = "v1"
page = 18

