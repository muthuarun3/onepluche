# Fiche relue par Muthu avant publication (dossier de conception, étape 6).
# Texte : « Programme de Solution Démocratique à l'élection présidentielle 2027 » (28 pages),
# mouvement présidé par Clara Egger. Publié le 5 novembre 2026 d'après le suivi de Swipe Your
# President sur data.gouv.fr (PDF créé le 3 novembre). Les citations dont le texte est coupé par
# la mise en page en deux colonnes sont recollées dans l'ordre de lecture.
#
# Candidature déclarée le 20 avril 2026 par communiqué de Solution Démocratique (Sud Radio,
# 20 juillet 2026).
#
# Le programme décrit surtout la méthode (référendums, rôle d'arbitre du président). Points non
# rangés faute de sujet dans la grille : consultations sur les statuts des outre-mer, à commencer
# par la Nouvelle-Calédonie (p. 17) ; gestion de crise (p. 23-24). Aucune mesure sur le logement
# ni sur le pouvoir d'achat.

