[[mesures]]
id = "institutions-referendum-article-89"
sujet = "institutions"
titre = "Référendum sur la révision de l’article 89 dans la semaine suivant la nomination du Premier ministre"
citation = "Dans la semaine qui suit la nomination du Premier ministre, et sur sa proposition, soumettre à référendum la révision de l’article 89 publiée sur notre site, qui permettra aux citoyens français d’exercer directement leur souveraineté."
version = "v1"
page = 11

[[mesures]]
id = "institutions-ric-constituant"
sujet = "institutions"
titre = "Initiative citoyenne constituante : 700 000 signatures en 18 mois ; référendum obligatoire sur les révisions"
citation = "Le texte intégral de la réforme est publié sur notre site. Il prévoit notamment un seuil de signatures de 700 000 citoyens en 18 mois et un référendum obligatoire sur les révisions constitutionnelles."
version = "v1"
page = 7

[[mesures]]
id = "institutions-ordonnances-49-3"
sujet = "institutions"
titre = "Refus de signer certaines ordonnances ; opposition au 49.3 sauf urgence"
citation = "Le président refusera de signer les ordonnances qui priveraient le Parlement d’un débat qui lui revient (article 13) et s’opposera en Conseil des ministres au recours au 49.3, sauf circonstances exceptionnelles liées à des urgences particulièrement flagrantes."
version = "v1"
page = 11

[[mesures]]
id = "institutions-dissolution"
sujet = "institutions"
titre = "Dissolution de l’Assemblée limitée à deux cas"
citation = "Ne dissoudre l’Assemblée nationale que dans deux cas : lorsque le Parlement se révèle incapable de former ou de soutenir un gouvernement, ou lorsque les citoyens le demandent explicitement, à travers une procédure constitutionnelle qu’ils auront définie eux-mêmes s’ils en ressentent le besoin. Jamais par convenance politique."
version = "v1"
page = 11

[[mesures]]
id = "institutions-conseil-constitutionnel"
sujet = "institutions"
titre = "Nomination au Conseil constitutionnel approuvée par trois cinquièmes des suffrages en commission"
citation = "Chaque candidat devra être approuvé par au moins trois cinquièmes des suffrages exprimés au sein des commissions compétentes des deux assemblées, alors qu’aujourd’hui l’article 13 permet de nommer un candidat tant que trois cinquièmes des parlementaires ne s’y opposent pas."
version = "v1"
page = 12

[[mesures]]
id = "institutions-bilan-mensuel"
sujet = "institutions"
titre = "Bilan public mensuel de la politique du gouvernement"
citation = "Présenter chaque mois un bilan public de la politique du gouvernement, des lois votées et des traités en cours de négociation."
version = "v1"
page = 12

[[mesures]]
id = "institutions-nominations"
sujet = "institutions"
titre = "Justification publique des nominations aux emplois civils et militaires"
citation = "Le président justifiera publiquement toutes les nominations aux emplois civils et militaires, et fixera des critères qui permettront à chacun de comprendre sur quelle base elles sont faites."
version = "v1"
page = 16

[[mesures]]
id = "institutions-article-16"
sujet = "institutions"
titre = "Pouvoirs exceptionnels de l’article 16 réservés aux menaces graves et immédiates"
citation = "Le président ne recourra aux pouvoirs exceptionnels de l’article 16 qu’en cas de menace grave et immédiate, au sens le plus strict. Il saisira lui-même le Conseil constitutionnel dès le premier jour et rendra compte de chacune de ses décisions devant le Parlement."
version = "v1"
page = 23

[[mesures]]
id = "institutions-maires"
sujet = "institutions"
titre = "Réunion des maires dès la première année pour les réformes territoriales"
citation = "Dès la première année, le président réunira les maires de France pour élaborer des réformes qui les associent directement aux réformes territoriales et leur permettent d’agir efficacement contre la fracture territoriale."
version = "v1"
page = 17

[[mesures]]
id = "justice-independance-referendum"
sujet = "securite-justice"
titre = "Référendum sur toute loi touchant au fonctionnement de la justice"
citation = "Garantir l’indépendance de l’autorité judiciaire, comme le prescrit l’article 64, en soumettant ainsi à référendum toute loi qui affecte le fonctionnement du pouvoir judiciaire."
version = "v1"
page = 11

[[mesures]]
id = "securite-initiative-citoyenne-police"
sujet = "securite-justice"
titre = "Initiative citoyenne sur les missions et règles de conduite de la police et de l’armée"
citation = "Être garant, c’est pouvoir décider en dernier ressort, par l’initiative citoyenne, des missions, des pratiques et des règles de conduite de la police, de l’armée et des autres services publics, si l’on estime que les représentants les définissent mal."
version = "v1"
page = 16

[[mesures]]
id = "depenses-budget-referendum"
sujet = "depenses-dette"
titre = "Loi de finances soumise chaque année à référendum"
citation = "Aucun déficit ne pourra être inscrit dans la loi de finances sans le consentement explicite des électeurs. Chaque année, la loi de finances adoptée par le Parlement sera soumise à référendum."
version = "v1"
page = 13

[[mesures]]
id = "depenses-budget-septembre"
sujet = "depenses-dette"
titre = "Dépôt du projet de budget début septembre"
citation = "Le président demandera au gouvernement de le déposer dès le début du mois de septembre."
version = "v1"
page = 13

[[mesures]]
id = "depenses-budget-citoyen"
sujet = "depenses-dette"
titre = "Budget proposé par initiative populaire, voté en alternative"
citation = "Les citoyens pouvant proposer eux-mêmes un budget par la voie de l’initiative populaire, le président se chargera de le faire voter en alternative au budget proposé par le Parlement."
version = "v1"
page = 13

[[mesures]]
id = "emploi-stabilite-regles"
sujet = "emploi-travail"
titre = "Protection contre les revirements de la législation et les excès de la bureaucratie"
citation = "Veiller à ce que l’état de droit protège chaque citoyen, qu’il travaille, entreprenne ou investisse, quelle que soit l’importance de son investissement, contre les revirements soudains de la législation et les excès de la bureaucratie."
version = "v1"
page = 14

[[mesures]]
id = "international-traites-referendum"
sujet = "europe-international"
titre = "Aucun traité engageant durablement la France ratifié sans vote des citoyens"
citation = "Aucun traité qui engage durablement les Français ne sera ratifié sans eux."
version = "v1"
page = 14

[[mesures]]
id = "international-defense-vote-populaire"
sujet = "europe-international"
titre = "Décisions d’intervention armée pouvant être remises en cause par un vote populaire"
citation = "Les décisions prises en urgence par le gouvernement, puis confirmées par le Parlement (article 35), pourront être remises en cause par un vote populaire."
version = "v1"
page = 15

[[mesures]]
id = "europe-clauses-retrait"
sujet = "europe-international"
titre = "Négociation de clauses de retrait des engagements européens"
citation = "Le président considère que les citoyens français ont pleinement le droit de revenir sur des engagements pris sans eux. Il fera tout son possible pour négocier avec nos partenaires des clauses de retrait applicables aux engagements que les Français rejetteraient par la voie directe."
version = "v1"
page = 24

[[mesures]]
id = "europe-sortie-si-vote"
sujet = "europe-international"
titre = "Sortie de l’UE négociée si les Français la décident"
citation = "si les Français décident que la France doit quitter l’Union européenne, ce qui est leur droit, le président respectera leur volonté et négociera la sortie dans leur intérêt."
version = "v1"
page = 24

[[mesures]]
id = "retraites-referendum"
sujet = "retraites"
titre = "Réformes des retraites soumises à référendum"
citation = "Le président veillera donc à ce que les principales réformes soient systématiquement expliquées et soumises à référendum."
version = "v1"
page = 18

[[mesures]]
