version = "v1"
page = 19

[[mesures]]
id = "energie-referendum-nucleaire"
sujet = "climat-energie"
titre = "Référendum sur une loi d’orientation fixant la place du nucléaire"
citation = "En l’absence d’initiative citoyenne, le président soumettra à référendum un projet de loi d’orientation proposé par le gouvernement. Arbitre de la bonne tenue du vote, il ne prendra pas lui-même position."
version = "v1"
page = 19

