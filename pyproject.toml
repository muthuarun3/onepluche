[project]
name = "demographie"
version = "0.1.0"
description = "Exploration et visualisation des données démographiques françaises (INSEE, DREES)"
readme = "README.md"
requires-python = ">=3.12"
# Chaque dépendance est justifiée dans le dossier de conception (étape 4).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[project.scripts]
demo = "demographie.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demographie"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
